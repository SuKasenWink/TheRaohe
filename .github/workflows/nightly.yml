name: Nightly

on:
  schedule:
    - cron: "0 0 * * *"  # utc 每天零點
  workflow_dispatch:

permissions:
  contents: write

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2

      # ubuntu-latest 預裝 Android NDK (ANDROID_SDK_ROOT/ndk/<ver>); xtask 自動挑最高版本
      - name: cargo xtask pack
        run: cargo xtask pack

      # 滾動 nightly: 刪舊版+tag, 再自動从 main 重建, 資產名固定 theraohe.tar.gz (pre-release)
      - name: Publish rolling nightly
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --yes || true
          git push origin :refs/tags/nightly || true
          gh release create nightly target/dist/theraohe.tar.gz \
            --target main \
            --prerelease \
            --title "Nightly" \
            --notes "Automated nightly build from main ($(git rev-parse --short HEAD))"
