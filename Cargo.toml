[package]
name = "theraohe"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "theraohe"
path = "src/theraohe.rs"

[dependencies]
libc = "0.2"
egui = { version = "0.37", default-features = false, features = ["default_fonts"] }
egui_software_backend = { package = "hdrshot-egui-backend", version = "0.2.0" }
glam = "0.29"
egui_extras = "0.37.0"
png = "0.17"
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
